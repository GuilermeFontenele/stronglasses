{% if pagina.has_other_pages %}
  <nav class="paginacao" aria-label="Páginas">
    {% if pagina.has_previous %}<a href="?{% if consulta %}{{ consulta }}&amp;{% endif %}pagina={{ pagina.previous_page_number }}">← Anterior</a>{% else %}<span></span>{% endif %}
    <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} itens</span>
    {% if pagina.has_next %}<a href="?{% if consulta %}{{ consulta }}&amp;{% endif %}pagina={{ pagina.next_page_number }}">Próxima →</a>{% else %}<span></span>{% endif %}
  </nav>
{% endif %}
