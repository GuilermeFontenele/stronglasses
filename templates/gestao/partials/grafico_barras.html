{% load gestao l10n %}{% localize off %}<svg class="grafico" viewBox="0 0 {{ g.largura }} {{ g.altura }}" role="img" aria-label="{{ titulo }}">
  {% for linha in g.grade %}
    <line class="grafico-grade" x1="{{ g.esquerda }}" x2="{{ g.direita }}" y1="{{ linha.y }}" y2="{{ linha.y }}"/>
    <text class="grafico-eixo" x="{{ g.esquerda|add:'-8' }}" y="{{ linha.y }}" text-anchor="end" dominant-baseline="middle">{{ linha.rotulo }}</text>
  {% endfor %}
  {% for b in g.itens %}
    <g class="grafico-barra{% if b.destaque %} destaque{% endif %}" tabindex="0" aria-label="{{ b.rotulo }}: {% if g.moeda %}{{ b.valor|brl }}{% else %}{{ b.valor|inteiro }}{% endif %}">
      <rect class="grafico-alvo" x="{{ b.x }}" y="{{ g.topo }}" width="{{ b.largura }}" height="{{ g.area_altura }}" fill="transparent"/>
      <rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.largura }}" height="{{ b.altura }}" rx="4"/>
      <text class="grafico-valor" x="{{ b.centro }}" y="{{ b.y_valor }}" text-anchor="middle">{% if g.moeda %}{{ b.valor|brl }}{% else %}{{ b.valor|inteiro }}{% endif %}</text>
      <text class="grafico-eixo" x="{{ b.centro }}" y="{{ g.rotulo_y }}" text-anchor="middle">{{ b.rotulo }}</text>
    </g>
  {% endfor %}
</svg>{% endlocalize %}
