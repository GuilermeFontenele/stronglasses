{% load gestao l10n %}{% localize off %}<svg class="grafico grafico-linha" viewBox="0 0 {{ g.largura }} {{ g.altura }}" role="img" aria-label="{{ titulo }}">
  {% for linha in g.grade %}
    <line class="grafico-grade" x1="{{ g.esquerda }}" x2="{{ g.direita }}" y1="{{ linha.y }}" y2="{{ linha.y }}"/>
    <text class="grafico-eixo" x="{{ g.esquerda|add:'-8' }}" y="{{ linha.y }}" text-anchor="end" dominant-baseline="middle">{{ linha.rotulo }}</text>
  {% endfor %}
  {% if g.area %}<polygon class="grafico-area" points="{{ g.area }}"/>{% endif %}
  {% if g.linha %}<polyline class="grafico-traco" points="{{ g.linha }}"/>{% endif %}
  {% for p in g.itens %}
    <circle class="grafico-ponto" cx="{{ p.centro }}" cy="{{ p.y }}" r="3.5"><title>{{ p.rotulo }}: {% if g.moeda %}{{ p.valor|brl }}{% else %}{{ p.valor|inteiro }}{% endif %}</title></circle>
    <text class="grafico-eixo" x="{{ p.centro }}" y="{{ g.rotulo_y }}" text-anchor="middle">{{ p.rotulo }}</text>
  {% endfor %}
</svg>{% endlocalize %}
