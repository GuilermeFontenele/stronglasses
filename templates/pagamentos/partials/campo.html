<div class="campo{% if largo %} campo-largo{% endif %}{% if campo.errors %} campo-com-erro{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% for e in campo.errors %}<span class="erro">{{ e }}</span>{% endfor %}
  {% if campo.help_text %}<small class="ajuda">{{ campo.help_text }}</small>{% endif %}
</div>
