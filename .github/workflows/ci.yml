name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.8"
      - run: ruff check .
      - run: ruff format --check .

  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stronglasses
          POSTGRES_USER: stronglasses
          POSTGRES_PASSWORD: senha-so-do-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stronglasses"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_NAME: stronglasses
      DB_USER: stronglasses
      DB_PASSWORD: senha-so-do-ci
      DB_HOST: localhost
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Primeira execução local (copiando o .env.example, como no README)
        run: |
          cp .env.example .env
          DJANGO_SETTINGS_MODULE=config.settings.dev python manage.py check
          rm .env
      - name: Migrations em dia com os models
        run: python manage.py makemigrations --check --dry-run -v 3
      - run: python manage.py migrate --noinput
      - run: coverage run manage.py test --verbosity 2
      - run: coverage report --show-missing

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements/dev.txt
      - name: Vulnerabilidades conhecidas nas dependências
        run: pip-audit -r requirements/base.txt
      - name: Checklist de deploy do Django (configuração de produção)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: www.stronglasses.com.br
          DB_NAME: verificacao
          DB_USER: verificacao
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export FIELD_ENCRYPTION_KEYS="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export FIELD_HASH_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput --dry-run > /dev/null
      - name: Procura segredos no histórico do git
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monta a imagem do servidor
        run: docker build -t stronglasses:ci .
      - name: A imagem sobe e responde no /saude/
        run: |
          docker network create loja
          docker run -d --name banco --network loja -e POSTGRES_DB=loja -e POSTGRES_USER=loja -e POSTGRES_PASSWORD=senha-ci postgres:17
          for i in $(seq 1 30); do docker exec banco pg_isready -U loja && break; sleep 1; done
          docker run -d --name app --network loja -p 8000:8000 \
            -e DJANGO_ALLOWED_HOSTS=localhost -e DJANGO_AMBIENTE=testes -e DJANGO_BEHIND_PROXY=1 -e DJANGO_SERVIR_MEDIA=1 \
            -e DB_NAME=loja -e DB_USER=loja -e DB_PASSWORD=senha-ci -e DB_HOST=banco -e DB_SSLMODE=disable \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            -e FIELD_ENCRYPTION_KEYS="$(docker run --rm stronglasses:ci python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" \
            -e FIELD_HASH_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            stronglasses:ci
          for i in $(seq 1 40); do curl -fsS http://localhost:8000/saude/ && break; sleep 2; done
          curl -fsS http://localhost:8000/saude/ | grep -q '"ok"'
          # Página da loja responde por HTTPS lógico (o proxy da hospedagem faz o TLS)
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://localhost:8000/)" = "200" || (docker logs app; exit 1)
          docker exec app sh -c 'test ! -e .env && test ! -d importacao && test ! -d .git'
          echo "Imagem ok: sobe, migra, responde e não carrega segredos."
